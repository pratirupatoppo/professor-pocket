services:
  - type: web
    name: professor-pocket
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt && python -m app.ingest && python -m app.retrieval
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app.web:app
    healthCheckPath: /api/health
    envVars:
      - key: OLLAMA_URL
        sync: false
      - key: OLLAMA_MODEL
        value: qwen2.5:1.5b
